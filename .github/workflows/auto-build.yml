name: Auto-Sync & Build VeinMiner for Leaf

on:
  schedule:
    # Automatické sestavení každou neděli ve 3:00 UTC ráno
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Tlačítko na ruční spuštění přímo z GitHub webového rozhraní

permissions:
  contents: write

jobs:
  build:
    name: Sync, Patch & Build VeinMiner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream VeinMiner (2008Choco/VeinMiner)
        uses: actions/checkout@v4
        with:
          repository: '2008Choco/VeinMiner'
          ref: 'master'
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch for Leaf API
        run: |
          echo "Patching repositories and dependencies for Leaf API..."
          sed -i '/repositories {/a \        maven("https://repo.papermc.io/repository/maven-public/")' build.gradle.kts
          sed -i '/dependencies {/a \    compileOnly("cn.dreeam.leaf:leaf-api:26.3.build.2-alpha")' veinminer-bukkit/build.gradle.kts

      - name: Build VeinMiner Bukkit with ShadowJar
        run: ./gradlew :veinminer-bukkit:shadowJar --no-daemon

      - name: Locate Build Artifact
        id: find_jar
        run: |
          JAR_PATH=$(find veinminer-bukkit/build/libs/ -name "VeinMiner-Bukkit-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "Found jar: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-leaf-build
          name: "VeinMiner (Leaf Build) - Auto-Updated"
          body: |
            Automaticky sestavený nejnovější build VeinMineru optimalizovaný pro **Leaf API (26.3)** a Paper/Purpur.
            
            - **Upstream repozitář:** [2008Choco/VeinMiner](https://github.com/2008Choco/VeinMiner)
            - **API cíl:** `cn.dreeam.leaf:leaf-api`
            - **Aktualizováno:** Každou neděli automaticky nebo na vyžádání.
          files: ${{ steps.find_jar.outputs.jar_path }}
          prerelease: false
          draft: false
