name: Auto-Sync & Build VeinMiner for Leaf

on:
  push:
    branches: [ main ]
  schedule:
    # Automatické sestavení každou neděli ve 3:00 UTC ráno
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Tlačítko na ruční spuštění přímo z GitHub webového rozhraní

permissions:
  contents: write

jobs:
  build:
    name: Sync & Build VeinMiner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream VeinMiner (MiraculixxT/Veinminer)
        uses: actions/checkout@v4
        with:
          repository: 'MiraculixxT/Veinminer'
          ref: 'main'
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build VeinMiner Paper & Enchantment with ShadowJar
        run: ./gradlew :veinminer:veinminer-paper:shadowJar :veinminer-enchant:jar --no-daemon

      - name: Process & Locate Build Artifacts
        id: find_jars
        run: |
          # Find and rename paper jar to leaf
          PAPER_RAW=$(find . -path "*/build/libs/*" -name "veinminer-paper-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -n "$PAPER_RAW" ]; then
            PAPER_DIR=$(dirname "$PAPER_RAW")
            PAPER_BASE=$(basename "$PAPER_RAW")
            LEAF_BASE="${PAPER_BASE/veinminer-paper-/veinminer-leaf-}"
            mv "$PAPER_RAW" "$PAPER_DIR/$LEAF_BASE"
            PAPER_JAR="$PAPER_DIR/$LEAF_BASE"
          else
            PAPER_JAR=$(find . -path "*/build/libs/*" -name "veinminer-leaf-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)
          fi

          ENCHANT_JAR=$(find . -path "*/build/libs/*" -name "veinminer-enchant-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)

          echo "Found Paper/Leaf jar: $PAPER_JAR"
          echo "Found Enchant jar: $ENCHANT_JAR"
          echo "paper_jar=$PAPER_JAR" >> $GITHUB_OUTPUT
          echo "enchant_jar=$ENCHANT_JAR" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-leaf-build
          name: "VeinMiner (Leaf Build) - Auto-Updated"
          body: |
            Automaticky sestavený nejnovější build VeinMineru (Kotlin / Paper & Folia kompatibilní) pro **Leaf 26.x**.
            
            - **Upstream repozitář:** [MiraculixxT/Veinminer](https://github.com/MiraculixxT/Veinminer) (větev `main`)
            - **Platforma:** Paper / Purpur / Leaf / Folia
            - **Java:** 25 (LTS)
            - **Obsahuje:**
              - `veinminer-leaf-{version}.jar` (hlavní plugin)
              - `veinminer-enchant-{version}.jar` (enchantment addon)
            - **Aktualizováno:** Každou neděli automaticky nebo na vyžádání.
          files: |
            ${{ steps.find_jars.outputs.paper_jar }}
            ${{ steps.find_jars.outputs.enchant_jar }}
          prerelease: false
          draft: false
