name: Auto-Sync & Build VeinMiner for Leaf

on:
  push:
    branches: [ main ]
  schedule:
    # Automatické sestavení každou neděli ve 3:00 UTC ráno
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Tlačítko na ruční spuštění přímo z GitHub webového rozhraní

permissions:
  contents: write

jobs:
  build:
    name: Sync & Build VeinMiner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream VeinMiner (MiraculixxT/Veinminer)
        uses: actions/checkout@v4
        with:
          repository: 'MiraculixxT/Veinminer'
          ref: 'main'
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch for Leaf dev-bundle (26.3.local-SNAPSHOT)
        run: |
          echo "==> Přidávám Leaf Maven snapshot repozitář do settings.gradle.kts pluginManagement..."
          sed -i 's|pluginManagement {|pluginManagement {|' settings.gradle.kts
          sed -i '/pluginManagement {/{n; s|repositories {|repositories {\n        maven("https://maven.leafmc.one/snapshots/")|;}' settings.gradle.kts

          echo "==> Přidávám Leaf Maven snapshot repozitář do buildSrc repositories..."
          sed -i 's|repositories {|repositories {\n    maven("https://maven.leafmc.one/snapshots/")|' buildSrc/build.gradle.kts

          echo "==> Přepisuji paperVersion v gradle.properties na Leaf dev-bundle verzi..."
          sed -i 's|^paperVersion=.*|paperVersion=26.3.local-SNAPSHOT|' gradle.properties

          echo "==> Přidávám Leaf Maven repozitář do buildSrc/paper-script convention pluginu..."
          sed -i 's|maven("https://repo.papermc.io/repository/maven-public/")|maven("https://repo.papermc.io/repository/maven-public/")\n    maven("https://maven.leafmc.one/snapshots/")|' buildSrc/src/main/kotlin/paper-script.gradle.kts

          echo "==> Odstraňuji Fabric, NeoForge a client moduly pro zrychlení buildu..."
          # Odstraň include() řádky pro nepotřebné moduly
          sed -i '/include.*fabric/d; /include.*neoforge/d; /include.*client/d' settings.gradle.kts
          # Odstraň i project().name = ... rename řádky pro smazané projekty (jinak Gradle selže)
          sed -i '/project.*fabric/d; /project.*neoforge/d; /project.*client/d' settings.gradle.kts

          echo "Hotovo – konfigurace pro Leaf 26.3.local-SNAPSHOT dokončena."

      - name: Build VeinMiner Paper & Enchantment with ShadowJar
        run: ./gradlew :veinminer-paper:shadowJar :veinminer-enchant:jar --no-daemon -x test -x spotlessCheck

      - name: Process & Locate Build Artifacts
        id: find_jars
        run: |
          # Find and rename paper jar to leaf
          PAPER_RAW=$(find . -path "*/build/libs/*" -name "veinminer-paper-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -n "$PAPER_RAW" ]; then
            PAPER_DIR=$(dirname "$PAPER_RAW")
            PAPER_BASE=$(basename "$PAPER_RAW")
            LEAF_BASE="${PAPER_BASE/veinminer-paper-/veinminer-leaf-}"
            mv "$PAPER_RAW" "$PAPER_DIR/$LEAF_BASE"
            PAPER_JAR="$PAPER_DIR/$LEAF_BASE"
          else
            PAPER_JAR=$(find . -path "*/build/libs/*" -name "veinminer-leaf-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)
          fi

          ENCHANT_JAR=$(find . -path "*/build/libs/*" -name "veinminer-enchant-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)

          echo "Found Paper/Leaf jar: $PAPER_JAR"
          echo "Found Enchant jar: $ENCHANT_JAR"
          echo "paper_jar=$PAPER_JAR" >> $GITHUB_OUTPUT
          echo "enchant_jar=$ENCHANT_JAR" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-leaf-build
          name: "VeinMiner (Leaf Build) - Auto-Updated"
          body: |
            Automaticky sestavený nejnovější build VeinMineru (Kotlin / Paper & Folia kompatibilní) pro **Leaf 26.x**.
            
            - **Upstream repo:** [MiraculixxT/Veinminer](https://github.com/MiraculixxT/Veinminer) (branc `main`)
            - **API:** `cn.dreeam.leaf:dev-bundle:26.3.local-SNAPSHOT` ([maven.leafmc.one/snapshots](https://maven.leafmc.one/snapshots/))
            - **Platform:** Paper / Purpur / Leaf / Folia
            - **Java:** 25 (LTS)
            - **Includes:**
              - `veinminer-leaf-{version}.jar` (main plugin)
              - `veinminer-enchant-{version}.jar` (enchantment addon)
            - **Updated:** Každou neděli automaticky nebo na vyžádání.
          files: |
            ${{ steps.find_jars.outputs.paper_jar }}
            ${{ steps.find_jars.outputs.enchant_jar }}
          prerelease: false
          draft: false
